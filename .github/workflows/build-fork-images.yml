name: Build fork images to GHCR

# Builds the backend + frontend Docker images from THIS fork and pushes them
# to ghcr.io/<owner>/moneymatter-{be,fe}, so the app can run in Portainer
# without a local build server.
#
# Runs on every push (any branch) and manually via workflow_dispatch.
# Uses the automatic GITHUB_TOKEN — no secrets to configure. The packages
# must be set to public in the repo/package settings afterwards so Portainer
# can pull them anonymously (or configure an image pull secret).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-fork-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/moneymatter
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          # Branch name sanitized to a valid Docker tag (slashes etc. -> dashes)
          branch_tag=$(echo "${GITHUB_REF_NAME}" | tr '/.' '--' | tr -c 'a-zA-Z0-9_-' '-' | cut -c1-64)
          {
            echo "be<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-be:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-be:sha-${GITHUB_SHA::7}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-be:${branch_tag}"
            echo "EOF"
            echo "fe<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fe:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fe:sha-${GITHUB_SHA::7}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fe:${branch_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./self-hosting/backend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.be }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./self-hosting/frontend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.fe }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_APP_COMMIT_HASH=${{ github.sha }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
